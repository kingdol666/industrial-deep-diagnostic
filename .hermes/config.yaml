# Industrial Deep Diagnostic — Hermes Project Config
#
# 此文件为项目级 Hermes 配置模板。推荐通过 Hermes profile 使用，
# 仅在当前项目激活 skill，不要把本项目 skill 注册到全局 ~/.hermes/skills/。
#
# 配置应用方式:
#   推荐: 使用 Hermes profile
#     1. 将本文件复制到 ~/.hermes/profiles/ind-diag/config.yaml
#     2. 将 skills.external_dirs 中的路径改为当前项目的绝对路径
#     3. 使用 hermes -p ind-diag
#
# 技能路径策略:
#   使用 skills.external_dirs 指向当前项目的 .hermes/skills/。
#   这样 skill 只在启用该 profile 时可见，不进入全局 skill 注册目录。

skills:
  external_dirs:
    - /ABSOLUTE/PATH/TO/industrial-deep-diagnostic/.hermes/skills

# === Delegation 配置 (delegate_task 子代理) ===
delegation:
  orchestrator_enabled: true
  max_spawn_depth: 2
  model: deepseek-v4-flash  
  provider: deepseek
  base_url: https://api.deepseek.com
  max_iterations: 80
  reasoning_effort: high

# === Vision 辅助模型配置 (vlm-visual-analyzer 依赖) ===
auxiliary:
  vision:
    # vision-capable 模型: 必须支持图像输入 (PNG 图表视觉分析)
    provider: deepseek
    model: deepseek-v4-pro     # ← vision-capable
    timeout: 300
    download_timeout: 60

  web_extract:
    provider: deepseek
    model: deepseek-v4-flash  
    timeout: 360
