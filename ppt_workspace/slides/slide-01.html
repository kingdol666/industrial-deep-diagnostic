<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960pt;height:540pt;overflow:hidden}
.slide{width:960pt;height:540pt;position:relative;background:#FFFFFF;font-family:'Comic Sans MS','Segoe Print',cursive}
</style>
</head>
<body>
<div class="slide">

  <!-- Decorative top-left sketch lines -->
  <div style="position:absolute;left:28pt;top:12pt;width:55pt;height:2pt;background:#000000;"></div>
  <div style="position:absolute;left:28pt;top:18pt;width:35pt;height:2pt;background:#4488FF;"></div>

  <!-- Hero cover illustration placeholder -->
  <div class="placeholder" id="img-hero" style="position:absolute;left:140pt;top:25pt;width:680pt;height:290pt;"></div>

  <!-- Main title -->
  <div style="position:absolute;left:0;top:335pt;width:960pt;text-align:center;">
    <h1 style="font-size:25pt;color:#000000;font-weight:bold;letter-spacing:1pt;">多智能体+RAG驱动的工业深度诊断系统</h1>
  </div>

  <!-- Blue underline accent -->
  <div style="position:absolute;left:440pt;top:376pt;width:80pt;height:3pt;background:#4488FF;border-radius:2pt;"></div>

  <!-- Subtitle -->
  <div style="position:absolute;left:0;top:390pt;width:960pt;text-align:center;">
    <p style="font-size:13pt;color:#333333;">从传感器数据到根因结论的8阶段自动化管线</p>
  </div>

  <!-- Bottom info line -->
  <div style="position:absolute;left:0;top:500pt;width:960pt;text-align:center;">
    <p style="font-size:10pt;color:#333333;">Industrial Deep Diagnostic &nbsp;|&nbsp; 2024</p>
  </div>

  <!-- Decorative bottom-right doodle lines -->
  <div style="position:absolute;right:28pt;bottom:12pt;width:45pt;height:2pt;background:#4488FF;"></div>
  <div style="position:absolute;right:28pt;bottom:18pt;width:30pt;height:2pt;background:#000000;"></div>

</div>
</body>
</html>
