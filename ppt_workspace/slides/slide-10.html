<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960pt;height:540pt;background:#F8F9FA;font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;position:relative;overflow:hidden}
</style>
</head>
<body>

<!-- Top bar -->
<div style="position:absolute;top:0;left:0;width:960pt;height:6pt;background:#1B3A5C;"></div>

<!-- Title -->
<h2 style="position:absolute;top:24pt;left:24pt;font-size:22pt;font-weight:700;color:#1B3A5C;letter-spacing:1.5pt;">三条核心结论</h2>
<div style="position:absolute;top:58pt;left:24pt;width:55pt;height:3pt;background:#E85D3A;"></div>

<!-- Top: Big conclusion card (2/3 width) -->
<div style="position:absolute;top:82pt;left:160pt;width:640pt;height:150pt;background:#FFFFFF;border:1px solid #DFE6E9;border-left:5pt solid #E85D3A;border-radius:6pt;padding:20pt 24pt;display:flex;flex-direction:column;justify-content:center;">
<div style="display:inline-block;background:#E85D3A;border-radius:3pt;padding:3pt 12pt;margin-bottom:10pt;align-self:flex-start;">
<p style="color:#FFFFFF;font-size:10pt;font-weight:700;">核心结论一</p>
</div>
<p style="font-size:20pt;font-weight:700;color:#1B3A5C;line-height:1.3;">划伤由产品型号差异主导</p>
<p style="font-size:11pt;color:#E85D3A;margin-top:6pt;">PG32D 划伤率是 PG22C 的 15 倍 —— 型号之间差异远大于型号内波动</p>
</div>

<!-- Bottom-left: Secondary conclusion -->
<div style="position:absolute;top:260pt;left:24pt;width:444pt;height:145pt;background:#FFFFFF;border:1px solid #DFE6E9;border-radius:6pt;padding:18pt 20pt;display:flex;flex-direction:column;justify-content:center;">
<div style="display:inline-block;background:#1B3A5C;border-radius:3pt;padding:3pt 10pt;margin-bottom:8pt;align-self:flex-start;">
<p style="color:#FFFFFF;font-size:9pt;font-weight:700;">核心结论二</p>
</div>
<p style="font-size:11pt;font-weight:700;color:#1B3A5C;line-height:1.4;">工艺-划伤强相关是型号混杂假象</p>
<p style="font-size:10pt;color:#636E72;margin-top:6pt;line-height:1.5;">所有工艺参数与划伤的强相关(r=0.43-0.49)在控制型号后衰减或反转。系统本身未出故障，参数差异是产品规格的自然反映。</p>
</div>

<!-- Bottom-right: Secondary conclusion -->
<div style="position:absolute;top:260pt;left:492pt;width:444pt;height:145pt;background:#FFFFFF;border:1px solid #DFE6E9;border-radius:6pt;padding:18pt 20pt;display:flex;flex-direction:column;justify-content:center;">
<div style="display:inline-block;background:#1B3A5C;border-radius:3pt;padding:3pt 10pt;margin-bottom:8pt;align-self:flex-start;">
<p style="color:#FFFFFF;font-size:9pt;font-weight:700;">核心结论三</p>
</div>
<p style="font-size:11pt;font-weight:700;color:#1B3A5C;line-height:1.4;">从型号规范管理入手，先降高频伤</p>
<p style="font-size:10pt;color:#636E72;margin-top:6pt;line-height:1.5;">建议优先对 PG32D、FP21 等高频伤型号建立专项 SOP，统一速度与扭矩控制标准。预期可将整体划伤率降低 50% 以上。</p>
</div>

<!-- Connecting line between conclusions -->
<div style="position:absolute;top:238pt;left:160pt;width:640pt;height:2pt;background:#E85D3A;opacity:0.5;"></div>

<!-- Footer -->
<div style="position:absolute;bottom:0;left:0;width:960pt;height:20pt;background:#F8F9FA;border-top:1px solid #DFE6E9;">
<p style="position:absolute;right:24pt;bottom:2pt;font-size:9pt;color:#636E72;">10 / 10</p>
</div>

</body>
</html>
