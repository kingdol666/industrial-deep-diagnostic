<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960pt;height:540pt;overflow:hidden}
.slide{width:960pt;height:540pt;position:relative;background:#FFFFFF;font-family:'Comic Sans MS','Segoe Print',cursive}
</style>
</head>
<body>
<div class="slide">

  <!-- Decorative top-left -->
  <div style="position:absolute;left:28pt;top:12pt;width:55pt;height:2pt;background:#000000;"></div>
  <div style="position:absolute;left:28pt;top:18pt;width:35pt;height:2pt;background:#4488FF;"></div>

  <!-- Title -->
  <div style="position:absolute;left:40pt;top:30pt;">
    <h1 style="font-size:20pt;color:#000000;font-weight:bold;">8步管线 x 6智能体：从原始数据到可信诊断</h1>
  </div>
  <div style="position:absolute;left:40pt;top:60pt;width:90pt;height:3pt;background:#4488FF;border-radius:2pt;"></div>

  <!-- Full-width pipeline architecture illustration -->
  <div class="placeholder" id="img-pipeline" style="position:absolute;left:40pt;top:80pt;width:880pt;height:340pt;"></div>

  <!-- Bottom annotation strip -->
  <div style="position:absolute;left:40pt;top:435pt;width:880pt;height:55pt;background:#F5F5F5;border:2pt solid #000000;border-radius:3pt;padding:10pt 16pt;">
    <p style="font-size:10pt;color:#000000;line-height:1.5;">修复循环：Judge评分 &lt; 90 重跑Diagnostician（最多3次）；Reviewer未通过则完整重跑D→J→R→R（全局上限5次）。计数器持久化在 <b>.pipeline_events.jsonl</b> 中，断电不丢失。</p>
  </div>

  <!-- Page number -->
  <div style="position:absolute;right:30pt;bottom:15pt;">
    <p style="font-size:10pt;color:#4488FF;">4</p>
  </div>

</div>
</body>
</html>
