upstream backend {
    server 127.0.0.1:3210;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /app/frontend/dist;
    index index.html;

    # App allows uploads up to 500MB; nginx default (1MB) would 413 them all.
    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers (HSTS belongs on the TLS terminator; see webfrp/Cloudflare Tunnel).
    # CSP is intentionally not set here: the SPA renders inline scripts/styles (ECharts,
    # Three.js). Enable a policy only after auditing the frontend build.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTE: /data-files/ and /workspace-files/ static aliases were REMOVED (2026-10-17):
    # they bypassed all API auth and exposed raw data + the SQLite DB file.
    # File access goes through /api/files/* (auth-guarded) only.

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # Long agent turns can idle the SSE stream for minutes; default 60s cuts it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
