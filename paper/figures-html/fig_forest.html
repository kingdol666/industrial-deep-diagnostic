<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="aei_template.css">
<style>
  body { width:1500px; height:545px; padding:18px 26px; }

</style></head><body>
<svg width="1448" height="545" viewBox="0 0 1448 545">

  <text class="axlabel" x="288" y="330" text-anchor="end" font-weight="bold">IDD — full library</text>

  <circle cx="330" cy="516" r="8" fill="#8f9aa5"/><text class="axlabel" x="346" y="521">published single-LLM baselines (FaultExplainer, arXiv:2412.14492)</text>
  <circle cx="900" cy="516" r="8" fill="#0072b2"/><text class="axlabel" x="916" y="521">IDD (this work)</text>
