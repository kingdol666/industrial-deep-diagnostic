<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="aei_template.css">
<style>
  * { box-sizing: border-box; }
  body { width:1500px; padding:12px 10px; }
  svg text { font-family: Arial, Helvetica, sans-serif; }
</style></head><body>
<svg id="svg" width="1480" height="712" viewBox="0 0 1480 712"></svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
function mk(n, a, txt) { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; }

// verified rows: [label, sub, est(%), lo, hi, colour-role]
// roles: fe = grey (published baseline), idd = blue, iddk = open blue (top-k), ctrl = open green
const ROWS = [
  ["FaultExplainer GPT-4o", "n = 11 · candidates in prompt", 63.6, 35.4, 84.8, "fe"],
  ["FaultExplainer o1-preview", "n = 11 · candidates in prompt", 81.8, 52.3, 94.9, "fe"],
  ["IDD — TEP subset", "n = 6 · no candidate list", 50.0, 18.8, 81.2, "idd"],
  ["IDD — all faults, Top-1", "n = 9 · no candidate list", 44.4, 18.9, 73.3, "idd"],
  ["IDD — top-k (survivor set)", "n = 9 · true cause among candidates", 100.0, 70.1, 100.0, "iddk"],
  ["IDD — controls passed", "n = 3 normal batches · zero false alarms", 100.0, 43.9, 100.0, "ctrl"],
];
const W = 1480, H = 712, L = 540, R = 96, T = 18, B = 172;
const XMAX = 100, X = v => L + (W - L - R) * v / XMAX;
const PH = H - T - B, rowH = PH / ROWS.length;
const GREY = "#8f9aa5", BLU = "#0072b2", GRN = "#009e73";

// gridlines + axis
for (let v = 0; v <= 100; v += 20) {
  mk("line", { x1: X(v), y1: T, x2: X(v), y2: T + PH, class: v === 0 ? "axis" : "gridline" });
  mk("text", { x: X(v), y: T + PH + 34, "text-anchor": "middle", class: "ticklabel" }, v === 100 ? "100%" : v);
}
mk("line", { x1: L, y1: T + PH, x2: X(100), y2: T + PH, class: "axis" });
mk("text", { x: L + (W - L - R) / 2, y: T + PH + 64, "text-anchor": "middle", class: "axlabel" },
  "accuracy with Wilson 95% CI (z = 1.96)");

const HALO = { "paint-order": "stroke", stroke: "#ffffff", "stroke-width": 5, "stroke-linejoin": "round" };
ROWS.forEach((r, i) => {
  const [label, sub, est, lo, hi, role] = r;
  const y = T + rowH * (i + 0.5);
  mk("text", { x: L - 16, y: y - 4, "text-anchor": "end", class: "axlabel",
    "font-weight": role === "idd" && label.includes("Top-1") ? "700" : "400", fill: "#1a1a1a" }, label);
  mk("text", { x: L - 16, y: y + 24, "text-anchor": "end", class: "ticklabel", fill: "#8f8f8f" }, sub);
  const stroke = role === "fe" ? GREY : role === "ctrl" ? GRN : BLU;
  // CI line — cap at axis end for 100% rows
  const xhi = Math.min(X(hi), X(100));
  mk("line", { x1: X(lo), y1: y, x2: xhi, y2: y, stroke: stroke, "stroke-width": 7, "stroke-linecap": "round", opacity: 0.55 });
  // point estimate
  if (role === "iddk" || role === "ctrl") {
    mk("circle", { cx: xhi, cy: y, r: 10, fill: "#ffffff", stroke: stroke, "stroke-width": 3.4 });
  } else {
    mk("circle", { cx: X(est), cy: y, r: 10, fill: stroke, stroke: "#ffffff", "stroke-width": 2 });
  }
  // value + CI annotation, placed on the emptier side
  const estX = role === "iddk" || role === "ctrl" ? xhi : X(est);
  const right = estX < X(78);
  const tx = right ? estX + 18 : estX - 18;
  mk("text", { x: tx, y: y - 6, "text-anchor": right ? "start" : "end", class: "datalabel", ...HALO }, est.toFixed(1) + "%");
  mk("text", { x: tx, y: y + 20, "text-anchor": right ? "start" : "end", class: "ticklabel", fill: "#555555", ...HALO },
    `[${lo.toFixed(1)}, ${hi.toFixed(1)}]`);
});

// legend: two stacked rows below the axis title
const LY = T + PH + 108;
mk("circle", { cx: 564, cy: LY - 8, r: 9, fill: GREY });
mk("text", { x: 580, y: LY, class: "ticklabel", fill: "#1a1a1a" }, "FE-reported baselines (Khan et al., 2025)");
mk("circle", { cx: 1244, cy: LY - 8, r: 9, fill: BLU });
mk("text", { x: 1260, y: LY, class: "ticklabel", fill: "#1a1a1a" }, "IDD (this work)");
const LY2 = LY + 36;
mk("circle", { cx: 564, cy: LY2 - 8, r: 9, fill: "#fff", stroke: BLU, "stroke-width": 3 });
mk("text", { x: 580, y: LY2, class: "ticklabel", fill: "#1a1a1a" }, "open marker = bounded at 100%");
mk("circle", { cx: 1244, cy: LY2 - 8, r: 9, fill: "#fff", stroke: GRN, "stroke-width": 3 });
mk("text", { x: 1260, y: LY2, class: "ticklabel", fill: "#1a1a1a" }, "IDD controls");
</script>
</body></html>
