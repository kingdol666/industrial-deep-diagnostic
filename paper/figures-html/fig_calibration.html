<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="aei_template.css">
<style>
  body { width:1500px; height:635px; padding:18px 26px; }
  svg text { font-family: Arial, Helvetica, sans-serif; }
</style></head><body>
<svg width="1448" height="635" viewBox="0 0 1448 635">
  <line class="axis" x1="330" y1="24" x2="330" y2="500"/>
  <line class="axis" x1="330" y1="500" x2="1420" y2="500"/>
  <g class="gridline">
    <line x1="548" y1="24" x2="548" y2="500"/><line x1="766" y1="24" x2="766" y2="500"/>
    <line x1="984" y1="24" x2="984" y2="500"/><line x1="1202" y1="24" x2="1202" y2="500"/>
    <line x1="1420" y1="24" x2="1420" y2="500"/>
  </g>
  <g class="ticklabel" text-anchor="middle">
    <text x="330" y="522">0</text><text x="548" y="522">0.25</text><text x="766" y="522">0.50</text>
    <text x="984" y="522">0.75</text><text x="1202" y="522">1.0</text>
  </g>
  <text class="axlabel" x="875" y="556" text-anchor="middle">Reported confidence (protocol ceiling 0.70 applies to COMPETING_SET / NEEDS_DATA verdicts — dashed line)</text>
  <line x1="1104" y1="24" x2="1104" y2="500" stroke="#e69f00" stroke-width="2" stroke-dasharray="7,5"/>

  <!-- bars: x(v) = 330 + v*1090 ; 9 fault scenarios -->
  <!-- SKAB inlet-valve 0.87 -->
  <text class="axlabel" x="322" y="48" text-anchor="end">SKAB inlet-valve throttling</text>
  <text class="ticklabel" x="322" y="64" text-anchor="end">vib. burst A2 z = 13.56</text>
  <rect x="330" y="34" width="948" height="26" fill="#0072b2"/>
  <text class="datalabel" x="1286" y="52">0.87</text>

  <!-- SKAB cavitation 0.82 -->
  <text class="axlabel" x="322" y="98" text-anchor="end">SKAB cavitation (blind set)</text>
  <text class="ticklabel" x="322" y="114" text-anchor="end">vib–flow r = −0.821</text>
  <rect x="330" y="84" width="894" height="26" fill="#0072b2"/>
  <text class="datalabel" x="1232" y="102">0.82</text>

  <!-- TEP IDV1 0.84 -->
  <text class="axlabel" x="322" y="148" text-anchor="end">TEP IDV1 A/C feed-ratio step</text>
  <text class="ticklabel" x="322" y="164" text-anchor="end">component spectra 4/6 dominant</text>
  <rect x="330" y="134" width="916" height="26" fill="#56b4e9"/>
  <text class="datalabel" x="1254" y="152">0.84</text>

  <!-- TEP IDV3 0.72 (weak) -->
  <text class="axlabel" x="322" y="198" text-anchor="end">TEP IDV3 D-feed temp. (hard)</text>
  <text class="ticklabel" x="322" y="214" text-anchor="end">weak-signature exclusion chain</text>
  <rect x="330" y="184" width="785" height="26" fill="#e69f00"/>
  <text class="datalabel" x="1123" y="202">0.72</text>

  <!-- TEP IDV4 0.86 -->
  <text class="axlabel" x="322" y="248" text-anchor="end">TEP IDV4 cooling temp. (step)</text>
  <text class="ticklabel" x="322" y="264" text-anchor="end">reactor temp. z = 10.06</text>
  <rect x="330" y="234" width="937" height="26" fill="#56b4e9"/>
  <text class="datalabel" x="1275" y="252">0.86</text>

  <!-- TEP IDV7 0.80 -->
  <text class="axlabel" x="322" y="298" text-anchor="end">TEP IDV7 C-header pressure</text>
  <text class="ticklabel" x="322" y="314" text-anchor="end">F-family + dual pressure</text>
  <rect x="330" y="284" width="872" height="26" fill="#56b4e9"/>
  <text class="datalabel" x="1210" y="302">0.80</text>

  <!-- TEP IDV11 0.70 (weak, at cap) -->
  <text class="axlabel" x="322" y="348" text-anchor="end">TEP IDV11 cooling temp. (random)</text>
  <text class="ticklabel" x="322" y="364" text-anchor="end">3.73σ sporadic form</text>
  <rect x="330" y="334" width="763" height="26" fill="#e69f00"/>
  <text class="datalabel" x="1101" y="352">0.70</text>

  <!-- TEP IDV14 0.68 (weak) -->
  <text class="axlabel" x="322" y="398" text-anchor="end">TEP IDV14 valve stiction</text>
  <text class="ticklabel" x="322" y="414" text-anchor="end">loop pair r = 0.998</text>
  <rect x="330" y="384" width="741" height="26" fill="#e69f00"/>
  <text class="datalabel" x="1079" y="402">0.68</text>

  <!-- IndPenSim 0.85 -->
  <text class="axlabel" x="322" y="448" text-anchor="end">IndPenSim batch-93 deviation</text>
  <text class="ticklabel" x="322" y="464" text-anchor="end">acid flow z = 15.8, pH 7.09</text>
  <rect x="330" y="434" width="927" height="26" fill="#009e73"/>
  <text class="datalabel" x="1265" y="452">0.85</text>

  <!-- legend -->
  <rect x="336" y="596" width="14" height="14" fill="#0072b2"/><text class="axlabel" x="358" y="608">SKAB</text>
  <rect x="436" y="596" width="14" height="14" fill="#56b4e9"/><text class="axlabel" x="458" y="608">TEP (standard signature)</text>
  <rect x="672" y="596" width="14" height="14" fill="#e69f00"/><text class="axlabel" x="694" y="608">TEP weak-signature (self-limited 0.68–0.72)</text>
  <rect x="1006" y="596" width="14" height="14" fill="#009e73"/><text class="axlabel" x="1028" y="608">IndPenSim</text>
</svg>
</body></html>
