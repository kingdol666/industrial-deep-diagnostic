<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="aei_template.css">
<style>
  * { box-sizing: border-box; }
  body { width:1500px; padding:14px 20px 16px; }
  svg text { font-family: Arial, Helvetica, sans-serif; }
</style></head><body>
<svg id="svg" width="1460" height="910"></svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
function mk(n, a, txt) { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; }

// verified values; kind: det | cs | ctrl ; over = exceeds 0.90 machine gate
const GROUPS = [
  { name: "SKAB", rows: [
    ["SKAB inlet-valve throttling", "valve vs control duty", 0.60, "cs", 0],
    ["SKAB cavitation (blind set)", "intermittent flow collapse", 0.60, "cs", 0],
    ["Control: SKAB anomaly-free", "anomaly-free segment", 0.86, "ctrl", 0],
  ]},
  { name: "TEP", rows: [
    ["TEP IDV1 A/C feed-ratio step", "A-feed valve/flow lockstep", 0.91, "det", 0.01],
    ["TEP IDV3 D-feed temp. (hard)", "steam-loop thermal fork", 0.55, "cs", 0],
    ["Control: TEP fault-free", "fault-free steady state", 0.90, "ctrl", 0],
    ["TEP IDV4 cooling (step)", "XMV_10 +6.8σ sustained step", 0.63, "cs", 0],
    ["TEP IDV7 C-header pressure", "valve +25.1% at constant flow", 0.78, "det", 0],
    ["TEP IDV11 cooling (random)", "variance burst, means frozen", 0.60, "cs", 0],
    ["TEP IDV14 valve stiction", "quantized stepping, lag 1→5", 0.80, "det", 0],
  ]},
  { name: "IndPenSim", rows: [
    ["IndPenSim batch-93 deviation", "CW loop pinned, 72/72 rows", 0.82, "det", 0],
    ["Control: IndPenSim batch-1", "recipe-driven normal batch", 0.93, "ctrl", 0.03],
  ]},
];

const defs = mk("defs", {});
defs.innerHTML =
  '<pattern id="hsky" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">' +
  '<rect width="7" height="7" fill="#56b4e9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#123a52" stroke-width="1.6"/></pattern>' +
  '<pattern id="hgrey" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">' +
  '<rect width="7" height="7" fill="#d4d8dd"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8f8f8f" stroke-width="1.6"/></pattern>';

const W = 1460, L = 470, R = 62;
const XMAX = 1.0, X = v => L + (W - L - R) * v / XMAX;
const RH = 46, GAPG = 16, rowH = RH + 10;
const T = 58;
const PH = 12 * rowH + (GROUPS.length - 1) * GAPG;
const B = T + PH;
const H = B + 128;

// gridlines + ticks
for (let v = 0; v <= 1.001; v += 0.2) {
  mk("line", { x1: X(v), y1: T, x2: X(v), y2: B, class: v === 0 ? "axis" : "gridline" });
  mk("text", { x: X(v), y: B + 32, "text-anchor": "middle", class: "ticklabel" }, v.toFixed(1));
}
mk("line", { x1: L, y1: B, x2: X(1), y2: B, class: "axis" });
mk("text", { x: L + (W - L - R) / 2, y: B + 62, "text-anchor": "middle", class: "axlabel" },
  "reported confidence");
// protocol cap 0.70 (dashed amber) + machine gate 0.90 (dotted grey), labels staggered above the plot
mk("line", { x1: X(0.70), y1: T, x2: X(0.70), y2: B, stroke: "#e69f00", "stroke-width": 2.4, "stroke-dasharray": "9,6" });
mk("line", { x1: X(0.90), y1: T, x2: X(0.90), y2: B, stroke: "#7a848e", "stroke-width": 1.8, "stroke-dasharray": "2,5" });
mk("text", { x: X(0.70) - 8, y: 26, "text-anchor": "end", class: "ticklabel", fill: "#a3690b", "font-weight": "700" }, "COMPETING_SET ceiling 0.70");
mk("text", { x: X(0.90) - 8, y: 50, "text-anchor": "end", class: "ticklabel", fill: "#7a848e" }, "machine grading gate 0.90");

let y = T;
const HALO = { "paint-order": "stroke", stroke: "#ffffff", "stroke-width": 4, "stroke-linejoin": "round" };
GROUPS.forEach((g, gi) => {
  if (gi > 0) y += GAPG;
  g.rows.forEach(r => {
    const [name, cue, conf, kind, over] = r;
    const yc = y + rowH / 2;
    mk("text", { x: L - 16, y: yc - 4, "text-anchor": "end", class: "ticklabel",
      fill: kind === "ctrl" ? "#555555" : "#1a1a1a", "font-style": kind === "ctrl" ? "italic" : "normal" }, name);
    mk("text", { x: L - 16, y: yc + 22, "text-anchor": "end", class: "ticklabel", fill: "#8f8f8f" }, cue);
    const by = yc - RH / 2, bw = X(conf) - L;
    if (kind === "det") mk("rect", { x: L, y: by, width: bw, height: RH, fill: "#0072b2" });
    else if (kind === "cs") mk("rect", { x: L, y: by, width: bw, height: RH, fill: "url(#hsky)", stroke: "#1f7fb5", "stroke-width": 0.8 });
    else mk("rect", { x: L, y: by, width: bw, height: RH, fill: "url(#hgrey)", stroke: "#8f8f8f", "stroke-width": 0.8 });
    const vt = kind === "det" ? "DET " : kind === "cs" ? "CS " : "normal ";
    const label = vt + conf.toFixed(2) + (over > 0 ? ` (+${over.toFixed(2)} over)` : "");
    const inside = X(conf) + 185 > W - R;   // keep the label inside the canvas
    mk("text", inside ? { x: X(conf) - 10, y: yc + 10, "text-anchor": "end", class: "datalabel", ...HALO }
                      : { x: X(conf) + 10, y: yc + 10, class: "datalabel", ...HALO }, label);
    if (over > 0) {
      mk("line", { x1: X(conf), y1: by - 5, x2: X(conf), y2: by + RH + 5, stroke: "#d55e00", "stroke-width": 3.5 });
    }
    y += rowH;
  });
});

// legend: two stacked rows, left-aligned, clear of the axis block
const LY = B + 98;
mk("rect", { x: L, y: LY - 18, width: 26, height: 20, fill: "#0072b2" });
mk("text", { x: L + 34, y: LY, class: "ticklabel", fill: "#1a1a1a" }, "determined fault verdict");
mk("rect", { x: 830, y: LY - 18, width: 26, height: 20, fill: "url(#hsky)", stroke: "#1f7fb5", "stroke-width": 0.8 });
mk("text", { x: 864, y: LY, class: "ticklabel", fill: "#1a1a1a" }, "capped set, truth ranked (5/5)");
const LY2 = LY + 40;
mk("rect", { x: L, y: LY2 - 18, width: 26, height: 20, fill: "url(#hgrey)", stroke: "#8f8f8f", "stroke-width": 0.8 });
mk("text", { x: L + 34, y: LY2, class: "ticklabel", fill: "#1a1a1a" }, "controls (normal)");
mk("line", { x1: 830, y1: LY2 - 8, x2: 856, y2: LY2 - 8, stroke: "#d55e00", "stroke-width": 3.5 });
mk("text", { x: 864, y: LY2, class: "ticklabel", fill: "#1a1a1a" }, "crosses the 0.90 gate (+0.01 / +0.03)");
</script>
</body></html>
